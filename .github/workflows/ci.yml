name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:route-index
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run smoke:routes
        env:
          SMOKE_PORT: "3310"
